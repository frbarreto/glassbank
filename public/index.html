<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Glass Bank X-ray: a live view of what a Model Context Protocol session with the bank actually did."
    />
    <meta name="robots" content="noindex" />
    <title>Glass Bank X-ray</title>
    <link rel="stylesheet" href="app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6bb5'/%3E%3Cpath d='M8 22V10h4.6c2.6 0 4.2 1.3 4.2 3.5 0 1.7-1 2.8-2.6 3.2L17 22h-3l-2.4-4.7H10.7V22H8zm2.7-6.8h1.7c1.2 0 1.9-.6 1.9-1.6s-.7-1.5-1.9-1.5h-1.7v3.1z' fill='white'/%3E%3Ccircle cx='22' cy='19' r='3.4' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E"
    />
  </head>
  <body data-mode="live">
    <!-- The pairing / empty state. Replaced by #app once a viewer scope exists. -->
    <div id="gate" class="gate"></div>

    <div id="app" class="app" hidden>
      <header id="header" class="header"></header>
      <div id="banner" class="banner-slot"></div>
      <div id="now" class="now-slot"></div>

      <main class="layout">
        <aside id="panel-sessions" class="panel panel-sessions" aria-label="Sessions"></aside>

        <section id="panel-timeline" class="panel panel-timeline" aria-label="Live timeline"></section>

        <section class="panel panel-detail-wrap" aria-label="Details">
          <div id="detail-tabs" class="detail-tabs"></div>
          <div
            id="panel-detail"
            class="detail-body"
            role="tabpanel"
            tabindex="-1"
            aria-labelledby="tab-call"
          ></div>
        </section>
      </main>

      <footer class="footer">
        <span>
          Everything on this page is derived from the protocol. The server never sees your chat,
          the model's reasoning or the answer you were given.
        </span>
        <span class="footer-keys">
          <kbd>/</kbd> filter &nbsp;&middot;&nbsp; <kbd>Esc</kbd> close
        </span>
      </footer>
    </div>

    <noscript>
      <p style="padding: 2rem; font: 16px system-ui">
        The X-ray dashboard is a live view of a Model Context Protocol session and needs JavaScript.
      </p>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
