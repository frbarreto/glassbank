# Glass Bank on a Compute Engine VM - Caddy in front of the app container
# (block: infra, task T0.4; docs/DEPLOYMENT.md section 2).
#
# This is the documented alternative to Cloud Run (Decision D-2 chose Cloud Run). It is a working
# stack, not prose: the same image built by infra/Dockerfile, behind Caddy for TLS.
#
# Two certificate strategies, one file each:
#   Caddyfile           option A, nip.io hostname          (default)
#   Caddyfile.ip-cert   option B, Let's Encrypt IP certificate
#
# Run it on the VM (Ubuntu 24.04, Docker Engine + compose plugin):
#
#   # option A - nip.io
#   export SITE_ADDRESS=34-30-1-2.nip.io ACME_EMAIL=you@example.com
#   export PUBLIC_BASE_URL=https://$SITE_ADDRESS PUBLIC_HOSTS=$SITE_ADDRESS
#   docker compose up -d
#
#   # option B - IP certificate
#   export PUBLIC_IP=34.30.1.2 ACME_EMAIL=you@example.com CADDYFILE=./Caddyfile.ip-cert
#   export PUBLIC_BASE_URL=https://$PUBLIC_IP PUBLIC_HOSTS=$PUBLIC_IP
#   docker compose up -d
#
# The image: either pull the one Cloud Build already produced (after
# `gcloud auth configure-docker us-central1-docker.pkg.dev`) by setting
#   MCP_BANK_IMAGE=us-central1-docker.pkg.dev/lake-fraude/lake-fraude/mcp-bank:<tag>
# or leave it unset and let compose build infra/Dockerfile from a checkout on the VM.

name: glass-bank-vm

services:
  caddy:
    image: caddy:2.11-alpine
    container_name: glass-bank-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP-01 challenge and the redirect to HTTPS
      - "443:443"
    environment:
      # Option A. Leave empty when using Caddyfile.ip-cert.
      SITE_ADDRESS: "${SITE_ADDRESS:-}"
      # Option B.
      PUBLIC_IP: "${PUBLIC_IP:-}"
      ACME_EMAIL: "${ACME_EMAIL:-}"
    volumes:
      - "${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro"
      # Certificates and ACME account keys. Losing this volume means re-issuing certificates,
      # which Let's Encrypt rate-limits; keep it.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - mcp-bank

  mcp-bank:
    image: "${MCP_BANK_IMAGE:-glass-bank:local}"
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    container_name: glass-bank
    restart: unless-stopped
    # No published port: only Caddy reaches the app, over the compose network.
    expose:
      - "8080"
    stop_grace_period: 15s
    init: true
    volumes:
      - mcp-bank-data:/data
    environment:
      NODE_ENV: production
      PORT: "8080"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

      # Must be the exact https URL users will type - never the http:// form Caddy redirects from.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL, e.g. https://34-30-1-2.nip.io}"
      PUBLIC_HOSTS: "${PUBLIC_HOSTS:?set PUBLIC_HOSTS, e.g. 34-30-1-2.nip.io}"
      ORIGIN_POLICY: "${ORIGIN_POLICY:-log-only}"
      FEATURE_FLAGS: "${FEATURE_FLAGS:-writes;transfers}"

      # On a VM there is no Secret Manager injection: put the real values in a root-owned .env
      # next to this file (chmod 600) or in the shell that runs `docker compose up`.
      OAUTH_SIGNING_KEY: "${OAUTH_SIGNING_KEY:?set OAUTH_SIGNING_KEY, e.g. $(openssl rand -base64 48)}"
      XRAY_ADMIN_TOKEN: "${XRAY_ADMIN_TOKEN:-}"

      # A VM has a real disk, so the SQLite files can outlive a restart. This is the one place the
      # VM is genuinely better than Cloud Run's memory-backed /tmp.
      XRAY_DB_PATH: "${XRAY_DB_PATH:-/data/xray.sqlite}"
      XRAY_RETENTION_HOURS: "${XRAY_RETENTION_HOURS:-72}"
      XS_IDLE_GAP_MINUTES: "${XS_IDLE_GAP_MINUTES:-15}"
      AUTH_DB_PATH: "${AUTH_DB_PATH:-/data/auth.sqlite}"
      MAX_DCR_CLIENTS: "${MAX_DCR_CLIENTS:-1000}"
      CIMD_ENABLED: "${CIMD_ENABLED:-false}"

      MAX_TABLES_PER_GRANT: "${MAX_TABLES_PER_GRANT:-10}"
      MAX_SCRATCH_DBS: "${MAX_SCRATCH_DBS:-200}"
      MAX_QUERY_ROWS: "${MAX_QUERY_ROWS:-100}"
      TABLE_TTL_MINUTES: "${TABLE_TTL_MINUTES:-30}"
      QUERY_TIMEOUT_MS: "${QUERY_TIMEOUT_MS:-2000}"
      MAX_CONCURRENT_ETL_OPS: "${MAX_CONCURRENT_ETL_OPS:-2}"
      ETL_WORKER_POOL_SIZE: "${ETL_WORKER_POOL_SIZE:-4}"

      MAX_MATERIALISED_PERSONAS: "${MAX_MATERIALISED_PERSONAS:-200}"
      MAX_PERSONA_OVERLAYS: "${MAX_PERSONA_OVERLAYS:-1000}"
      PERSONA_OVERLAY_TTL_HOURS: "${PERSONA_OVERLAY_TTL_HOURS:-24}"

      RATE_LIMIT_IP_REGISTER: "${RATE_LIMIT_IP_REGISTER:-60}"
      RATE_LIMIT_IP_AUTHORIZE: "${RATE_LIMIT_IP_AUTHORIZE:-300}"
      RATE_LIMIT_IP_CONSENT: "${RATE_LIMIT_IP_CONSENT:-60}"
      RATE_LIMIT_IP_PAIR_FAILURES: "${RATE_LIMIT_IP_PAIR_FAILURES:-5}"
      RATE_LIMIT_CLIENT_TOKEN: "${RATE_LIMIT_CLIENT_TOKEN:-120}"
      RATE_LIMIT_GRANT_TOOL_CALLS: "${RATE_LIMIT_GRANT_TOOL_CALLS:-120}"
      RATE_LIMIT_LOGIN_GRANTS: "${RATE_LIMIT_LOGIN_GRANTS:-20}"

      SNAPSHOT_BUCKET: "${SNAPSHOT_BUCKET:-}"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  caddy-data:
  caddy-config:
  mcp-bank-data:
